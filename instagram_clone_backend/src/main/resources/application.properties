spring.application.name=instagram_clone
# Application Port
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/instagramclone?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
# show-sql disabled for security — never log SQL in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Cloudinary Config — set via environment variables in production; empty for local dev (uploads will fail)
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Allow up to 100MB for file uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Resend API Key for Email OTP
resend.api.key=${RESEND_API_KEY:}

# JWT Secret — set JWT_SECRET env variable in production; fallback used for local dev only
jwt.secret=${JWT_SECRET:local-dev-secret-do-not-use-in-production-change-me-123456}

# VAPID Keys for Web Push Notifications (works even when browser is closed)
# Generate new keys with: npx web-push generate-vapid-keys
# In production on Render, set VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY env variables
vapid.public.key=${VAPID_PUBLIC_KEY:BMHJLFvxxiYbV4ZiO4smN9vl6mULyqoXRiRQEkXQBFE1bR8FIF7dWwgL7E9CCMeJbGECcptI3T3LWGVOORmCsYU}
vapid.private.key=${VAPID_PRIVATE_KEY:-fDIdJqDeciN_5aN-kFnwIvTMB64iAwN1mc1A7BNa6E}
vapid.subject=${VAPID_SUBJECT:mailto:admin@trend-app.com}
